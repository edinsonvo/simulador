[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sicm"
version = "5.1.0rc1.post3"
description = "Simulador Integral de Choques Macroeconómicos — Plataforma reutilizable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Edinson Patrocinio Valencia Omaña", email = "edvalenciao@unal.edu.co"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.32",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[tool.setuptools]
packages = [
    "sicm_core",
    "sicm_core.engine",
    "sicm_core.models",
    "sicm_core.experiments",
    "sicm_core.results",
    "sicm_core.analysis",
    "sicm_core.io",
    "research_lab",
    "research_lab.ui",
    "research_lab.visualization",
    "research_lab.reports",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
